name: Check kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # Run every OS to the end, so a failure on one doesn't hide the result of the other.
      fail-fast: false
      matrix:
        # macOS checks the syntax of scripts/bump.sh with bash 3.2, the oldest bash it supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCRIPTS_PKMS: ${{ github.workspace }}/scripts-pkms
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so check.py can compare kit/ with the last release tag.
          fetch-depth: 0
      - name: Install ripgrep and jq, which pkm expects
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ripgrep jq; else brew install ripgrep jq; fi
      - name: Check out scripts-pkms, whose commands the kit calls
        uses: actions/checkout@v5
        with:
          repository: Zejnilovic/scripts-pkms
          path: scripts-pkms
          # The pkm release the agreement requires (pkm version --require in kit/AGENTS.md); raise it with that line.
          ref: v0.5.0
      - name: Consistency checks
        run: python3 scripts/check.py
