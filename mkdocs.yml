# The documentation site, https://zejnilovic.github.io/agentic-pkms, built from docs/ by the Docs workflow.
# It is the sibling of the Daybook Method's site (scripts-pkms) and shares its look; scripts/site_hooks.py is the same
# file in both repos and adapts the docs' links.
# Preview it: pip install -r docs/requirements.txt, then mkdocs serve.
site_name: The agentic Daybook
site_description: An AI agent for a Daybook vault. It reads your week, asks and drafts the brief, the posting and the close. Every line links its source, nothing is deleted or sent, and nothing happens without your yes.
site_url: https://zejnilovic.github.io/agentic-pkms/
repo_url: https://github.com/Zejnilovic/agentic-pkms
repo_name: Zejnilovic/agentic-pkms
edit_uri: edit/main/docs/
copyright: MIT License © Sasa Zejnilovic

exclude_docs: |
  overrides/
  requirements.txt

hooks:
  - scripts/site_hooks.py

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/daybook.css
  - stylesheets/agent.css

extra_javascript:
  - javascripts/daybook.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zejnilovic/agentic-pkms
  sibling:
    name: The Daybook Method
    url: https://zejnilovic.github.io/scripts-pkms/
    note: the method itself, done by hand, with pkm for speed. It works without any agent
  site_hooks:
    repo_blob: https://github.com/Zejnilovic/agentic-pkms/blob/main/
    siblings:
      https://github.com/Zejnilovic/scripts-pkms/blob/main/docs/: https://zejnilovic.github.io/scripts-pkms/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "¶"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - The agentic Daybook: methodology.md
  - For your AI agent: agent.md
